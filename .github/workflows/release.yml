name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.4)'
        required: true
        default: 'v1.0.4'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            echo "google-services.json restored from secret"
          else
            echo "WARNING: using embedded real-project placeholder"
            cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "483958825006",
              "project_id": "meditrack-ai-c5d5a",
              "storage_bucket": "meditrack-ai-c5d5a.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:483958825006:android:91d91ccd82bddb2ee53fbf",
                  "android_client_info": { "package_name": "com.meditrack.meditrack_ai" }
                },
                "api_key": [{ "current_key": "AIzaSyCjwcETN3NYAa4-Jf0cU-jJf_7oD5Pfh_U" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Write firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            echo "$FIREBASE_OPTIONS_DART" | base64 -d > lib/firebase_options.dart
            echo "firebase_options.dart restored from secret"
          else
            ls lib/firebase_options.dart 2>/dev/null && echo "firebase_options.dart found in repo" || echo "WARNING: firebase_options.dart not found"
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Create and push git tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "Tag $VERSION created and pushed"
          fi

      - name: Rename APK
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/MediTrack-AI-${VERSION}.apk
          echo "APK_NAME=MediTrack-AI-${VERSION}.apk" >> $GITHUB_ENV
          echo "APK_PATH=build/app/outputs/flutter-apk/MediTrack-AI-${VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "MediTrack AI ${{ env.VERSION }}"
          body: |
            ## ?? MediTrack AI ${{ env.VERSION }}

            ### ?? How to Install
            1. Download **`${{ env.APK_NAME }}`** below
            2. On Android go to **Settings ? Security ? Install unknown apps** and allow it
            3. Open the downloaded APK and tap **Install**

            > Requires Android 6.0 (API 23) or higher � ~60 MB
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
