name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'          # triggers on version tags like v1.0.0, v1.2.3
  workflow_dispatch:       # allows manual trigger from GitHub Actions UI
    inputs:
      version:
        description: 'Release version (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java (required for Android build) ──────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Set up Flutter ────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      # ── 4. Restore Firebase config files from secrets ────────────
      #    Add these secrets in repo Settings > Secrets > Actions:
      #    GOOGLE_SERVICES_JSON : base64 encoded android/app/google-services.json
      #    FIREBASE_OPTIONS_DART : base64 encoded lib/firebase_options.dart
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            echo "google-services.json restored from secret"
          else
            echo "WARNING: GOOGLE_SERVICES_JSON secret not set"
            echo "Creating placeholder google-services.json..."
            cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "483958825006",
              "project_id": "meditrack-ai",
              "storage_bucket": "meditrack-ai.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:483958825006:android:placeholder",
                  "android_client_info": { "package_name": "com.example.meditrack_ai" }
                },
                "api_key": [{ "current_key": "placeholder" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Write firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            echo "$FIREBASE_OPTIONS_DART" | base64 -d > lib/firebase_options.dart
            echo "firebase_options.dart restored from secret"
          else
            echo "WARNING: FIREBASE_OPTIONS_DART secret not set - checking if file exists in repo"
            ls lib/firebase_options.dart 2>/dev/null && echo "File found in repo" || echo "File NOT found"
          fi

      # ── 5. Install dependencies ───────────────────────────────────
      - name: Install Flutter dependencies
        run: flutter pub get

      # ── 6. Build release APK ──────────────────────────────────────
      - name: Build release APK
        run: flutter build apk --release --no-pub

      # ── 7. Rename APK with version ────────────────────────────────
      - name: Rename APK
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/MediTrack-AI-${VERSION}.apk
          echo "APK_NAME=MediTrack-AI-${VERSION}.apk" >> $GITHUB_ENV
          echo "APK_PATH=build/app/outputs/flutter-apk/MediTrack-AI-${VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      # ── 8. Create GitHub Release & Upload APK ────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "MediTrack AI ${{ env.VERSION }}"
          body: |
            ## 📱 MediTrack AI ${{ env.VERSION }}

            ### ⬇️ How to Install
            1. Download **`${{ env.APK_NAME }}`** below
            2. On your Android phone, go to **Settings → Security → Unknown Sources** (or *Install unknown apps*) and allow it
            3. Open the downloaded APK file and tap **Install**

            > Requires Android 6.0 (API 23) or higher • ~65 MB

            ### 🆕 What's New
            - Interactive animated app logo with pulse & particle burst on tap
            - Rotating dashed ring animation around logo
            - Glassmorphism design with blue-cyan gradient
            - Improved splash screen animations
            - Bug fixes and performance improvements
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
